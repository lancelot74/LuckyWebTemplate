<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  #gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#f4f6fb;color:#1e293b;padding:24px;text-align:center;}
  #gate h1{font-size:1.4rem;font-weight:600;margin:0;}
  #gate p{margin:0;color:#64748b;max-width:420px;}
  #denied{color:#dc2626;display:none;font-weight:500;}
  #app{display:none;border:0;width:100%;height:100vh;}
  .box{background:#fff;border:1px solid #e6ebf3;border-radius:14px;padding:32px 28px;box-shadow:0 8px 30px rgba(15,23,42,.06);display:flex;flex-direction:column;align-items:center;gap:18px;}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h1>This page is private</h1>
    <p>Sign in with Google to continue. Only the authorized account can view this page.</p>
    <div id="g_id_onload"
         data-client_id="774333419250-pk4qv1me8cv73g5qaddeqbbnbjqnrbd6.apps.googleusercontent.com"
         data-callback="onSignIn"
         data-auto_prompt="false"></div>
    <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="signin_with" data-shape="pill"></div>
    <p id="denied">That account isn't authorized to view this page.</p>
  </div>
</div>
<iframe id="app" title="content"></iframe>
<script>
  var ALLOWED = "garhysam@gmail.com";
  function parseJwt(token){
    try{
      var base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
      var json = decodeURIComponent(atob(base64).split('').map(function(c){
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(json);
    }catch(e){ return null; }
  }
  function onSignIn(response){
    var payload = parseJwt(response.credential);
    var denied = document.getElementById('denied');
    if(payload && payload.email_verified && (payload.email || '').toLowerCase() === ALLOWED){
      document.getElementById('gate').style.display = 'none';
      var frame = document.getElementById('app');
      frame.src = 'app.html';
      frame.style.display = 'block';
    } else {
      denied.style.display = 'block';
    }
  }
</script>
</body>
</html>
